services:
  server:
    build: .
    container_name: server
    command: ["server"]
    ports:
      - "5000:5000"
    volumes:
        - ./data:/app/data

  client1:
    build: .
    container_name: client-1
    command: ["client"]
    environment:
      SERVER_HOST: server
      SERVER_PORT: 5000
    depends_on:
      - server
    stdin_open: true
    tty: true

  client2:
    build: .
    container_name: client-2
    command: ["client"]
    environment:
      SERVER_HOST: server
      SERVER_PORT: 5000
    depends_on:
      - server
    stdin_open: true
    tty: true