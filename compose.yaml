services:
  server1:
    build: .
    container_name: server1
    command: ["server"]
    environment:
      SERVER_ID: ${SERVER1_ID}
      SERVER_IP: ${SERVER1_IP}
      SOCKET_PORT: ${SERVER1_SOCKET_PORT}
      PEER_SERVERS: ${SERVER1_PEERS}
    ports:
      - "${SERVER1_SOCKET_PORT}:${SERVER1_SOCKET_PORT}"
      - "${SERVER1_REST_PORT}:8080"
    volumes:
      - ./data/server1:/app/data

  server2:
    build: .
    container_name: server2
    command: ["server"]
    environment:
      SERVER_ID: ${SERVER2_ID}
      SERVER_IP: ${SERVER2_IP}
      SOCKET_PORT: ${SERVER2_SOCKET_PORT}
      PEER_SERVERS: ${SERVER2_PEERS}
    ports:
      - "${SERVER2_SOCKET_PORT}:${SERVER2_SOCKET_PORT}"
      - "${SERVER2_REST_PORT}:8080"
    volumes:
      - ./data/server2:/app/data

  server3:
